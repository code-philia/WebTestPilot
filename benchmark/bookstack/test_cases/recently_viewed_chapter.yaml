name: Recently Viewed Chapter
setup_function: login_to_bookstack
steps:
- action: From the dashboard click "Books" link in navigation
  expectation: Books listing page appears
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()

- action: Click on book title "Book2"
  expectation: Book detail page opens
  ground_truth: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()

- action: Click on chapter title "Chapter 1"
  expectation: Chapter detail page opens
  ground_truth: |
    expect(page.locator("h1")).to_contain_text("Chapter 1")

- action: Click on the Bookstack logo top left of navbar
  expectation: Both 'Book2' and 'Chapter 1' item appears at the top of the "My Recently Viewed" list, whether it was already present or newly added. All other items retain their previous order
  ground_truth: |
    expect(page.locator("#recently-viewed")).to_contain_text("Chapter 1 Description")
