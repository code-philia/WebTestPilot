name: Buyer Add Product to Wishlist
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click on 'Auto Customer' in the top navigation bar
  expectation: A page with title 'Your account' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Your account")).to_be_visible()
- action: Click on 'My Wishlists'
  expectation: A list of wishlist folder(s) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="My wishlists")).to_be_visible()
- action: Click on the center of the white container with 'My wishlist (4)'
  expectation: A grid of wishlisted products is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_text("My wishlist", exact=True)).to_be_visible()
- action: Click on 'Clothes' tab in navigation bar
  expectation: A list of products is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Clothes")).to_be_visible()
- action: Scroll down
  expectation: A list of products is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_text("Hummingbird printed t-shirt")).to_be_visible()
- action: Click on the heart icon for 'Hummingbird printed t-shirt' product
  expectation: A dialog box with title 'My wishlists' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("listitem").filter(has_text="My wishlist")).to_be_visible()
- action: Click on 'My wishlist' list item under 'My wishlists'
  expectation: The dialog box with title 'My wishlists' is no longer visible
  ground_truth: |
    product = page.locator(".js-product").nth(0)  # or your specific product
    icon = product.locator("button.wishlist-button-add i.material-icons")
    expect(icon).to_have_text("favorite")
- action: Scroll Up
  expectation: A list of products is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Clothes")).to_be_visible()
- action: Click on 'Auto Customer' in the top navigation bar
  expectation: A page with title 'Your account' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Your account")).to_be_visible()
- action: Click on 'My Wishlists'
  expectation: A list of wishlist folder(s) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="My wishlists")).to_be_visible()
- action: Click on the center of the white container with 'My wishlist (4)'
  expectation: The grid of wishlisted products should be equal to initial list plus
    the new wishlisted product
  ground_truth: expect(page.get_by_text("My wishlist", exact=True)).to_be_visible()
paragraph: Click 'Auto Cust' in top nav. 'Your acct' pg shows. Click 'My Wishlists'.
  List of folders shown. Click mid of 'My wishlist (4)' container. Grid of prod shown.
  Click 'Clothes' tab. Prod list shown. Scroll down. Prod list shown. Click heart
  icon on 'Hummingbird t-shirt'. 'My wishlists' dlg shows. Click 'My wishlist' li.
  Dlg gone. Scroll up. Prod list shown. Click 'Auto Cust' in top nav. 'Your acct'
  pg shows. Click 'My Wishlists'. List of folders shown. Click mid of 'My wishlist
  (4)' container. Grid should = init list + new prod
