name: Seller View Catalog Product Details
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Catalog' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.locator("#subtab-AdminProducts").get_by_role("link", name="Products")).to_be_visible()
- action: Click on 'Products' under 'Catalog'
  expectation: A products list is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
- action: Click on the name of the first product
  expectation: A product details page with Categories, Brand, and Related Products
    section is shown
  ground_truth: |
    expect(page.get_by_text("Product name", exact=True)).to_be_visible()
- action: Click on 'Go to Catalog'
  expectation: The products list (by product name. Keep only letters, numbers, and
    spaces; convert to lowercase) should be exactly equal to initial list
  ground_truth: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
paragraph: To begin your journey through the interface, you'll want to focus your
  attention on the 'Catalog' option nestled within the sidebar. Next, ensure that
  the page you've navigated to proudly displays the title 'Dashboard', confirming
  you're in the right place. Now, proceed to click on 'Products' which is conveniently
  located under the 'Catalog' section for easy access. Understandably, a list of products
  will appear before your eyes, but don't worry about the specifics just yet. Imagine
  yourself as a curious explorer who decides to click on the name of the very first
  product listed, eager to uncover its secrets. Upon arrival, you'll find yourself
  on a detailed page that includes sections for Categories, Brand, and Related Products,
  all neatly organized for your convenience. If you ever feel lost, simply click on
  'Go to Catalog' to return to familiar territory. Lastly, when comparing the products
  list, remember to filter it down to just letters, numbers, and spaces, then convert
  everything to lowercase to ensure an exact match with the initial list you encountered.
