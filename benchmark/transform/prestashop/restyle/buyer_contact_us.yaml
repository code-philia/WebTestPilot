name: Buyer Contact Us
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click on 'Contact us' in the top navigation bar
  expectation: A form with title 'Contact us' and an 'OUR COMPANY' section in the
    footer is shown (no need to check other details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Store information")).to_be_visible()
- action: Type 'Checkout issues' in the 'Message' field
  expectation: Message field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Message")).to_have_value("Checkout issues")
- action: Click 'Send'
  expectation: A success message is shown
  ground_truth: |
    expect(page.get_by_role("textbox", name="Message")).not_to_be_visible()
paragraph: 'To initiate communication, locate and select the ''Contact us'' option
  within the primary navigation menu at the page''s header. Note: Upon interaction,
  a dialogue box labeled ''Contact us'' appears alongside a corporate information
  segment at the bottom; further examination of additional elements is unnecessary.
  If you''re experiencing checkout difficulties, input ''Checkout issues'' into the
  designated message area for clarity. Confirm that the message field accurately reflects
  the entered query before proceeding. Next, press the ''Send'' button to submit your
  inquiry. Should everything function correctly, a confirmation notification will
  materialize, indicating successful submission.'
