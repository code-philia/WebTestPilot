name: Buyer Sort Products by Name Z to A
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Art' tab in the navigation bar
  expectation: A grid of products under 'Art' category is shown (no need to check
    details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Art")).to_be_visible()
- action: Click on 'Studio Design' in the 'Brands' sidebar
  expectation: A list of products by brand 'Studio Design' is shown (no need to check
    details)
  ground_truth: |
    expect(page.locator("h1")).to_contain_text("List of products by brand Studio Design")
- action: Click on 'Sort by' dropdown
  expectation: A dropdown of sort options is shown
  ground_truth: |
    expect(page.get_by_role("link", name="Name, Z to A")).to_be_visible()
- action: Click on 'Name, Z to A' option
  expectation: The products are correctly sorted by 'Name, Z to A', and must be extracted
    using a left-to-right zig-zag grid traversal (no need to get image)
  ground_truth: expect(page.get_by_label("Sort by selection")).to_contain_text("Name,
    Z to A")
paragraph: To begin your artistic journey, simply click the 'Art' tab located in the
  navigation bar. Next, you will observe a grid of products falling under the 'Art'
  category; however, there's no requirement to delve into the specifics at this stage.
  For those seeking precision, proceed to click on 'Studio Design' within the 'Brands'
  sidebar, unleashing a list of products by the specified brand without needing to
  scrutinize further. Imagine encountering a dropdown menu labeled 'Sort by'; this
  is where you'll find yourself next. In case you're puzzled about sorting options,
  just click on 'Name, Z to A' to see the products neatly organized from Z to A. Lastly,
  picture a scenario where these products are perfectly aligned for extraction via
  a left-to-right zig-zag grid traversal—just remember, there's no need to capture
  any images.
