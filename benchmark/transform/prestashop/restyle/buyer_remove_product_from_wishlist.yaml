name: Buyer Remove Product from Wishlist
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click on 'Auto Customer' in the top navigation bar
  expectation: A page with title 'Your account' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Your account")).to_be_visible()
- action: Click on 'My Wishlists'
  expectation: A list of wishlist folder(s) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="My wishlists")).to_be_visible()
- action: Click on the center of the white container with 'My wishlist (4)'
  expectation: A grid of wishlisted products is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_text("My wishlist", exact=True)).to_be_visible()
- action: Click on the 'Delete' icon for the first product
  expectation: A dialog box with title 'Remove product from wishlist' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Remove product from wishlist")).to_be_visible()
- action: Click on 'Remove'
  expectation: The grid of wishlisted products should be equal to initial list minus
    the deleted product
  ground_truth: expect(page.locator("h1")).to_contain_text("My wishlist (3)")
paragraph: To begin your journey through the customer interface, you'll want to focus
  your cursor on the 'Auto Customer' option nestled within the top navigation bar.
  Next, proceed by clicking on 'My Wishlists', ensuring that the subsequent display
  reveals a collection of wishlist folders, as expected in a well-organized digital
  environment. For those seeking a technical understanding, it's important to note
  that selecting the central area of the white container labeled 'My wishlist (4)'
  will trigger the appearance of a grid showcasing all items currently wishlisted.
  Imagine a scenario where you're browsing through your cherished items; suddenly,
  you decide to remove one by clicking the 'Delete' icon next to the first product
  listed. Should you encounter any issues at this stage, remember that a dialog box
  titled 'Remove product from wishlist' should pop up, confirming your action. With
  a final flourish, click on 'Remove' and watch as the magic unfolds—the grid now
  reflects your updated preferences, with the initial list reduced by the item you've
  just discarded.
