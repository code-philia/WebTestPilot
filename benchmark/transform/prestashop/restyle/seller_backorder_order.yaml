name: Seller Backorder Order
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Orders' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
- action: Click on 'Orders' subsection under 'Orders'
  expectation: A list of orders is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Orders", exact=True)).to_be_visible()
- action: Click on the order ID '5' with reference 'KHWLILZLL'
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("body")).to_contain_text("€27.30")
- action: Click on 'Awaiting bank wire payment' dropdown button
  expectation: A dropdown containing 'On backorder (not paid)' option is shown
  ground_truth: |
    expect(page.get_by_role("option", name="On backorder (not paid)")).to_be_visible()
- action: Click on 'On backorder (not paid)' option
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.get_by_role("option", name="On backorder (not paid)")).not_to_be_visible()
- action: Click on 'Update status' button
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="On backorder (not paid)")).to_be_visible()
- action: Wait
  expectation: All status records on the page align with the update
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="On backorder (not paid)")).to_be_visible()
paragraph: To begin your journey through the system, you'll want to focus your attention
  on the 'Orders' section nestled within the sidebar. Next, proceed to click on the
  'Orders' subsection that lies beneath its parent category, ensuring you're diving
  deeper into the order management area. For those seeking technical precision, the
  page should now display a title reading 'Dashboard', serving as your confirmation
  point. Imagine a scene where a list of orders materializes before your eyes, though
  for our purposes today, we won't be poring over the finer details. Now, let's say
  you're on a quest to find the order with ID '5' and a cryptic reference 'KHWLILZLL';
  clicking on it will whisk you away to the order details page. If you encounter any
  issues where the numerical subtotal doesn't hover around '27.30', give the system
  a gentle nudge and try again—it's all about staying within the acceptable tolerance
  range. With the 'Awaiting bank wire payment' dropdown button now in your sights,
  give it a tap to reveal the options lurking beneath. Among the choices presented,
  select the 'On backorder (not paid)' option, as if marking a checkbox in an intricate
  puzzle. After making your selection, the order details page should once again confirm
  the numerical subtotal at '27.30', proving consistency is key. Finally, press the
  'Update status' button, and like magic, the page refreshes to reflect your changes.
  In the end, after a brief pause, every status record on the page should seamlessly
  align with the updates you've just applied, completing the cycle.
