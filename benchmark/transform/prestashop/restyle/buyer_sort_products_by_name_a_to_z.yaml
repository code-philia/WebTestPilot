name: Buyer Sort Products by Name A to Z
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Art' tab in the navigation bar
  expectation: A grid of products under 'Art' category is shown (no need to check
    details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Art")).to_be_visible()
- action: Click on 'Studio Design' in the 'Brands' sidebar
  expectation: A list of products by brand 'Studio Design' is shown (no need to check
    details)
  ground_truth: |
    expect(page.locator("h1")).to_contain_text("List of products by brand Studio Design")
- action: Click on 'Sort by' dropdown
  expectation: A dropdown of sort options is shown
  ground_truth: |
    expect(page.get_by_role("link", name="Name, A to Z")).to_be_visible()
- action: Click on 'Name, A to Z' option
  expectation: The products are correctly sorted by 'Name, A to Z', and must be extracted
    using a left-to-right zig-zag grid traversal (no need to get image)
  ground_truth: expect(page.get_by_label("Sort by selection")).to_contain_text("Name,
    A to Z")
paragraph: To begin your artistic journey, simply click the 'Art' tab located within
  the navigation bar. Next, you'll find yourself presented with a grid of products
  falling under the 'Art' category; there's no need to delve into the specifics here.
  For those seeking precision, refer to the 'Brands' sidebar and select 'Studio Design,'
  which will then display a list of products associated with this particular brand—again,
  no need for a detailed examination. Imagine a scenario where you encounter a dropdown
  menu labeled 'Sort by'; this is your cue to interact with it. An array of sorting
  options magically appears before your eyes, awaiting your choice. If you're puzzled
  about how to proceed, just click on the 'Name, A to Z' option to organize the items
  alphabetically. In a world where order brings clarity, the products now align themselves
  perfectly from 'A to Z,' and for the final step, employ a left-to-right zig-zag
  grid traversal technique to extract these names without the distraction of images.
