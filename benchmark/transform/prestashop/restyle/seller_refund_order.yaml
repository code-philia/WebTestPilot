name: Seller Refund Order
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Orders' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
- action: Click on 'Orders' subsection under 'Orders'
  expectation: A list of orders is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Orders", exact=True)).to_be_visible()
- action: Click on the order ID '5' with reference 'KHWLILZLL'
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("body")).to_contain_text("€27.30")
- action: Click on 'Awaiting bank wire payment' dropdown button
  expectation: A dropdown containing 'Delivered' option is shown
  ground_truth: |
    expect(page.get_by_role("option", name="Delivered")).to_be_visible()
- action: Type 'Refunded' in the search box above dropdown
  expectation: A dropdown containing 'Refunded' option is shown
  ground_truth: |
    expect(page.get_by_role("option", name="Refunded")).to_be_visible()
- action: Click on 'Refunded' option
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.get_by_role("option", name="Refunded")).not_to_be_visible()
- action: Click on 'Update status' button
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="Refunded")).to_be_visible()
- action: Wait
  expectation: All status records on the page align with the update
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="Refunded")).to_be_visible()
paragraph: To begin your journey through the system's interface, you'll want to focus
  your attention on the 'Orders' section nestled within the sidebar. Next, ensure
  that the page you're viewing proudly displays the title 'Dashboard', serving as
  your beacon of navigation. Now, proceed to click on the 'Orders' subsection, which
  is tucked neatly under its parent category, following the clear instructions laid
  out before you. A list of orders will appear before your eyes, but for now, there's
  no need to delve into their intricate details. Your next task involves locating
  the order ID '5', which carries the unique reference 'KHWLILZLL', and clicking on
  it, as if embarking on a treasure hunt through a digital landscape. Upon reaching
  the order details page, you should find the numerical subtotal displayed as '27.30',
  give or take a little, much like finding a needle in a haystack of numbers. If you're
  having trouble locating the 'Awaiting bank wire payment' dropdown button, don't
  fret; just give it a click and watch as a dropdown menu unfolds, revealing the 'Delivered'
  option among its choices. With the search box above the dropdown now in your sights,
  type 'Refunded' into it, and like magic, a dropdown menu will appear, showcasing
  the 'Refunded' option for your selection. After selecting 'Refunded', the order
  details page will once again display the numerical subtotal as '27.30', within an
  acceptable margin of error, confirming the system's consistency. Click the 'Update
  status' button, and like a wave crashing onto the shore, the page will refresh,
  still showing the numerical subtotal as '27.30', within tolerance, a testament to
  the system's reliability. Finally, take a moment to wait, allowing all the status
  records on the page to align perfectly with the recent update, ensuring everything
  is in harmony.
