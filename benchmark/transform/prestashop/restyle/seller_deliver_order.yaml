name: Seller Deliver Order
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Orders' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
- action: Click on 'Orders' subsection under 'Orders'
  expectation: A list of orders is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Orders", exact=True)).to_be_visible()
- action: Click on the order ID '5' with reference 'KHWLILZLL'
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("body")).to_contain_text("€27.30")
- action: Click on 'Awaiting bank wire payment' dropdown button
  expectation: A dropdown containing 'Delivered' option is shown
  ground_truth: |
    expect(page.get_by_role("option", name="Delivered")).to_be_visible()
- action: Click on 'Delivered' option
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.get_by_role("option", name="Delivered")).not_to_be_visible()
- action: Click on 'Update status' button
  expectation: The order details page displays the numerical subtotal as '27.30' within
    tolerance
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="Delivered")).to_be_visible()
- action: Wait
  expectation: All status records on the page align with the update
  ground_truth: |
    expect(page.locator("#update_order_status_action_input_wrapper").get_by_role("combobox", name="Delivered")).to_be_visible()
paragraph: To begin your journey through the system's interface, you'll want to focus
  your attention on the 'Orders' section nestled within the sidebar. Next, ensure
  that the page you're viewing proudly displays the title 'Dashboard', serving as
  your beacon of navigation. Now, proceed to click on the 'Orders' subsection, which
  is tucked neatly under its parent category, following the clear instructions laid
  out before you. A list of orders will appear before your eyes, but for now, let's
  not delve into the specifics of these entries. Your next task involves selecting
  the order ID '5', which carries the unique reference 'KHWLILZLL', like finding a
  needle in a haystack. Upon reaching the order details page, you should observe the
  numerical subtotal, which hovers around '27.30', give or take a little, much like
  a tightrope walker maintaining balance. If you encounter any issues at this stage,
  simply click on the 'Awaiting bank wire payment' dropdown button, where you'll find
  the 'Delivered' option waiting patiently for your selection. Imagine a story unfolding
  as you click on the 'Delivered' option, transforming the status of the order right
  before your very eyes. After this magical transformation, the order details page
  will once again display the numerical subtotal, '27.30', within an acceptable range,
  as if nothing had changed. With a sense of finality, press the 'Update status' button,
  sealing the deal on this transaction. As you wait, picture all the status records
  on the page aligning themselves like soldiers in formation, reflecting the recent
  update.
