name: Buyer Sort Products by Price High to Low
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Art' tab in the navigation bar
  expectation: A grid of products under 'Art' category is shown (no need to check
    details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Art")).to_be_visible()
- action: Click on 'Studio Design' in the 'Brands' sidebar
  expectation: A list of products by brand 'Studio Design' is shown (no need to check
    details)
  ground_truth: |
    expect(page.locator("h1")).to_contain_text("List of products by brand Studio Design")
- action: Click on 'Sort by' dropdown
  expectation: A dropdown of sort options is shown
  ground_truth: |
    expect(page.get_by_role("link", name="Price, high to low")).to_be_visible()
- action: Click on 'Price, high to low' option
  expectation: The products are correctly sorted by 'Price, high to low', and must
    be extracted using a left-to-right zig-zag grid traversal (no need to get image)
  ground_truth: expect(page.get_by_label("Sort by selection")).to_contain_text("Price,
    high to low")
paragraph: To begin your artistic journey, simply click the 'Art' tab located in the
  navigation bar. Next, you will observe a grid of products falling under the 'Art'
  category; however, there's no requirement to delve into the specifics at this stage.
  For those seeking precision, navigate to the 'Brands' sidebar and select 'Studio
  Design,' which will reveal a list of products associated with this particular brand,
  without needing to inspect further details. Imagine encountering a dropdown menu
  labeled 'Sort by'; this is where you should focus your attention next. If you're
  faced with sorting challenges, opt for the 'Price, high to low' within the dropdown
  to organize the items accordingly. Once selected, the products will align themselves
  in descending order based on price, necessitating a methodical extraction via a
  left-to-right zig-zag grid traversal, though images are not required for this task.
