name: Seller Delete Product
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Catalog' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.locator("#subtab-AdminProducts").get_by_role("link", name="Products")).to_be_visible()
- action: Click on 'Products' under 'Catalog'
  expectation: A products list is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
- action: Click on the ID 19, which is the first product
  expectation: The product details page with 'Product name' and 'Summary' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Summary")).to_be_visible()
- action: At the bottom of the page, next to 'Go to catalog' button, click triple
    dots
  expectation: A dropdown containing 'Delete' is shown
  ground_truth: |
    expect(page.get_by_role("button", name="delete Delete")).to_be_visible()
- action: Click on 'Delete' option
  expectation: A dialog with title 'Permanently delete this product?' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Permanently delete this")).to_be_visible()
- action: Click on 'Delete'
  expectation: The products list should be equal to initial list minus the delete
    product
  ground_truth: |
    expect(page.get_by_text("Successful deletion")).to_be_visible()
paragraph: 'To begin your journey through the interface, you''ll want to focus your
  attention on the ''Catalog'' link nestled within the sidebar. Next, proceed to verify
  that the page you''ve navigated to proudly displays the title ''Dashboard'', ensuring
  you''re in the right place. For those seeking a technical guide, simply locate and
  select the ''Products'' section found beneath the ''Catalog'' heading. Imagine a
  scenario where a list of products magically appears before your eyes; no need to
  delve into the specifics of each item just yet. Now, let''s dive into a bit of storytelling:
  our hero, the user, must bravely click on the ID 19, marking the beginning of an
  adventure with the first product on the list. If you''re ever lost and need a conceptual
  understanding, think of the product details page as a treasure map, revealing the
  ''Product name'' and ''Summary'' for your perusal. Should you encounter any issues,
  remember that near the ''Go to catalog'' button at the page''s bottom, a trio of
  dots holds the key to further options. Aha! You''ve successfully unveiled a dropdown
  menu, and within it lies the fateful ''Delete'' option, waiting to be clicked. Before
  you proceed, a warning dialog emerges, asking if you truly wish to ''Permanently
  delete this product?''; it''s like a final checkpoint in a video game. With a steady
  hand, confirm your decision by clicking ''Delete'', sealing the product''s fate.
  Lastly, in a casual chat among friends, one might say, ''Check out the products
  list now; it should look just like it did at the start, but with one less item,
  thanks to our little adventure.'''
