name: Seller View Shop Design
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Design' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.locator("#subtab-AdminThemesParent").get_by_role("link", name="Theme & Logo")).to_be_visible()
- action: Click on 'Theme & Logo'
  expectation: A 'Choose layouts' button is visible
  ground_truth: |
    expect(page.get_by_role("heading", name="Theme & Logo > Theme")).to_be_visible()
- action: Click on 'Pages Configuration' tab
  expectation: A 'See all theme's modules' button is visible
  ground_truth: |
    expect(page.get_by_role("heading", name="Pages Configuration")).to_be_visible()
- action: Click on 'Email Theme' in sidebar
  expectation: A 'Generate emails' button is visible
  ground_truth: |
    expect(page.get_by_role("heading", name="Email Theme", exact=True)).to_be_visible()
- action: Click on 'Pages' in sidebar
  expectation: A 'Pages in category Home' pages list is visible
  ground_truth: |
    expect(page.get_by_role("heading", name="Pages", exact=True)).to_be_visible()
- action: Click on 'Image Settings' in sidebar
  expectation: An 'Add new image type' button is visible
  ground_truth: |
    expect(page.get_by_role("heading", name="Image Settings")).to_be_visible()
paragraph: To begin your journey through the design interface, you'll want to start
  by clicking on 'Design' located in the sidebar. Next up, ensure that the page you're
  viewing prominently displays the title 'Dashboard', as this confirms you're in the
  right place. For those looking for detailed instructions, proceed by clicking on
  'Theme & Logo' to access further customization options. Note that a 'Choose layouts'
  button should now be visible on your screen, indicating readiness for layout selection.
  Let’s move forward by selecting the 'Pages Configuration' tab, which will reveal
  additional settings for your content structure. If you encounter any issues, remember
  that a 'See all theme's modules' button is available, providing access to all modular
  components. Our story continues as we click on 'Email Theme' within the sidebar,
  leading us to a section where a 'Generate emails' button awaits your interaction.
  In a more relaxed tone, let's not forget to check out 'Pages' in the sidebar too,
  because it’s there that a list of 'Pages in category Home' becomes visible. Lastly,
  for the creative souls among us, clicking on 'Image Settings' in the sidebar will
  unveil an 'Add new image type' button, opening doors to endless design possibilities.
