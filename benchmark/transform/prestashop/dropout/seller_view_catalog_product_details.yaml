name: Seller View Catalog Product Details
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Catalog' in sidebar
  expectation: The page contains title 'Dashboard'
  ground_truth: |
    expect(page.locator("#subtab-AdminProducts").get_by_role("link", name="Products")).to_be_visible()
- action: Click on 'Products' under 'Catalog'
  expectation: A products list is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
- action: Click on the name of the first product
  expectation: A product details page with Categories, Brand, and Related Products
    section is shown
  ground_truth: |
    expect(page.get_by_text("Product name", exact=True)).to_be_visible()
- action: Click on 'Go to Catalog'
  expectation: The products list (by product name. Keep only letters, numbers, and
    spaces; convert to lowercase) should be exactly equal to initial list
  ground_truth: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
paragraph: Click on 'Catalog' in sidebar. The page contains title 'Dashboard'. Click
  on 'Products' under 'Catalog'. A products list is shown (no need to check details).
  Click on the name of the first product. A product details page with Categories,
  Brand, and Related Products section is shown. Click on 'Go to Catalog'.
