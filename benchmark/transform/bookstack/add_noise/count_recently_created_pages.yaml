name: Count Recently Created Pages
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: A profile card with 'Created Content' is shown
  ground_truth: |
    expect(page.get_by_text("Created Content")).to_be_visible()
- action: Click 'View All' to the right of 'Recently Created Pages'
  expectation: The user's created pages is consistent with the previous 'Created Content'
    count
  ground_truth: |
    expect(page.get_by_role("heading", name="Search Results")).to_be_visible()
