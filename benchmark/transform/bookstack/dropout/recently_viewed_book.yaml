name: Recently Viewed Book
setup_function: login_to_bookstack
steps:
- action: From the dashboard click "Books" link in navigation
  expectation: Page with title 'Books' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
- action: Click on book title "Book2"
  expectation: Page with title 'Book2' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
- action: Click on the Bookstack logo top left of navbar
  expectation: The 'Book2' item appears at the top of the "My Recently Viewed" list,
    whether it was already present or newly added. All other items retain their previous
    order
  ground_truth: expect(page.locator("#recently-viewed")).to_contain_text("Book2 Description")
paragraph: From the dashboard click "Books" link in navigation. Page with title 'Books'
  is shown. Page with title 'Book2' is shown. Click on the Bookstack logo top left
  of navbar. The 'Book2' item appears at the top of the "My Recently Viewed" list,
  whether it was already present or newly added. All other items retain their previous
  order.
