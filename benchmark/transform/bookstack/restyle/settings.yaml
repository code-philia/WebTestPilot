name: Settings
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Settings' in navigation
  expectation: Page with 'Save Settings' button appear
  ground_truth: |
    expect(page.get_by_role("heading", name="Features & Security")).to_be_visible()
- action: Click on 'Customization' in sidebar
  expectation: Page with title 'Customization' and 'Save Settings' button appear
  ground_truth: |
    expect(page.get_by_role("heading", name="Customization")).to_be_visible()
- action: Click on 'Registration' in sidebar
  expectation: Page with title 'Registration' and 'Save Settings' button appear
  ground_truth: |
    expect(page.get_by_role("heading", name="Registration")).to_be_visible()
- action: Click on 'Sorting' in sidebar
  expectation: Page with title 'Sorting' and 'Create Sort Rule' button appear
  ground_truth: |
    expect(page.get_by_role("heading", name="Sorting")).to_be_visible()
paragraph: To begin your journey through the settings, you'll want to navigate from
  the dashboard and tap on 'Settings' within the navigation menu. Next, ensure that
  the page displaying the 'Save Settings' button has appeared correctly; if not, refresh
  the page or check your internet connection. For those looking for detailed instructions,
  simply locate and select 'Customization' from the sidebar options provided. Imagine
  a scene where the 'Customization' page magically materializes before your eyes,
  complete with its titular heading and the ever-present 'Save Settings' button. If
  you're stuck on what to do next, fear not—just click on 'Registration' in the sidebar,
  and voilà! The 'Registration' page will greet you with its own title and the familiar
  'Save Settings' button. Lastly, in a more relaxed tone, just chill and hit 'Sorting'
  in the sidebar, and presto, you'll be faced with a page titled 'Sorting' alongside
  a handy 'Create Sort Rule' button.
