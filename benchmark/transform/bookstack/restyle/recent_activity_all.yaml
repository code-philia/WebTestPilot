name: Recent Activity All
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: The 'Recent Activity' list is in chronological order
  ground_truth: expect(page.get_by_role("heading", name="Recent Activity")).to_be_visible()
paragraph: To access your profile settings, simply tap on the profile icon located
  at the top right corner of the screen. Next, you will observe a dropdown menu emerge,
  showcasing various profile-related choices; among these, 'View Profile' is clearly
  listed. For technical reference, ensure that after selecting the 'View Profile'
  option, the system navigates to the designated profile page without any latency.
  If you encounter issues where the 'Recent Activity' does not display correctly,
  check if the list updates in reverse chronological order as expected. Once upon
  a time, a user found their way through the digital labyrinth and was delighted to
  see their recent activities neatly arranged from newest to oldest. Hey there! Just
  wanted to drop a quick note—make sure everything's looking good on your end with
  those activities lined up like ducks in a row.
