name: Search
setup_function: login_to_bookstack
steps:
- action: Click on search icon button
  expectation: Search results page appear with 'Update Search' button
  ground_truth: |
    expect(page.get_by_role("heading", name="Search Results")).to_be_visible()
- action: Click on 'Books' link in navigation
  expectation: Books listing page is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
- action: Click on book title 'Book2'
  expectation: The chapters and pages in 'Book2' is consistent with previous search
    results
  ground_truth: expect(page.get_by_role("heading", name="Book2")).to_be_visible()
paragraph: 'To begin your journey, you''ll want to interact with the search icon button,
  which is your gateway to a world of information. Next, follow these instructions
  carefully: once the search results page appears, make sure to locate and click the
  ''Update Search'' button for the latest data. For those seeking technical guidance,
  it''s important to note that clicking on the ''Books'' link within the navigation
  will direct you to the Books listing page. Imagine a story where a curious reader
  clicks on the book title ''Book2'', only to find themselves immersed in its contents.
  If you encounter any issues, remember that the chapters and pages in ''Book2'' should
  match what was displayed in your previous search results, ensuring consistency throughout
  your reading experience.'
