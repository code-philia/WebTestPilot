name: Count Recently Created Shelves
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: There exists a 'Recently Created Shelves' section that is consistent
    with 'Created Content' counts
  ground_truth: expect(page.get_by_text("Created Content")).to_be_visible()
paragraph: To access your personal settings, you should click on the profile icon
  located at the top right corner of the screen. Next, a dropdown menu will emerge,
  revealing various profile options; among these, you'll find the 'View Profile' button.
  For those who are new to this feature, simply tap on the 'View Profile' option to
  proceed. If you encounter any issues where the 'Recently Created Shelves' section
  does not match the 'Created Content' counts, ensure that all updates have been applied
  correctly. Once upon a time, a user navigated through their digital library and
  stumbled upon a magical section called 'Recently Created Shelves,' which was always
  in sync with their 'Created Content' tally. Hey there! Just wanted to drop a quick
  note—make sure the 'Recently Created Shelves' area aligns perfectly with what's
  listed under 'Created Content' for an accurate overview.
