name: Recent Activity Page
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Page1' link
  expectation: The 'Recent Activity' (user, activity, timestamp data) consistent with
    the previous dashboard's 'Recent Activity' list
  ground_truth: expect(page.get_by_role("heading", name="Details")).to_be_visible()
paragraph: To begin, navigate from the dashboard and select the 'Page1' link. Note
  that the 'Recent Activity' section displays user, activity, and timestamp data,
  mirroring what was previously shown on the dashboard's 'Recent Activity' list. For
  technical reference, ensure the consistency between the two 'Recent Activity' lists
  is maintained across the transition. If you encounter discrepancies, check the data
  synchronization settings for any issues. Once upon a time, a user clicked through
  to 'Page1' and was delighted to see their recent activities listed just as they
  were on the main dashboard. Just a heads-up, folks, make sure when you hit 'Page1',
  your recent activities are still in sync with the dashboard's records!
