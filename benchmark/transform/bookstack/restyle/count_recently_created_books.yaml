name: Count Recently Created Books
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: There exists a 'Recently Created Books' section that is consistent
    with 'Created Content' counts
  ground_truth: expect(page.get_by_text("Created Content")).to_be_visible()
paragraph: To access your personal settings, you should click on the profile icon
  located at the top right corner of the screen. Next, a dropdown menu will emerge,
  revealing various profile options; among these, you'll find the 'View Profile' button.
  For those who are looking for detailed instructions, simply tap on the 'View Profile'
  option to proceed further. It's important to understand that within your profile
  page, there is a specific area dedicated to showcasing 'Recently Created Books,'
  which aligns perfectly with the 'Created Content' statistics listed. If you encounter
  any issues where the book count doesn't match, double-check that you're viewing
  the correct section of your profile. Once upon a time, a user navigated through
  their profile and was delighted to see all their hard work displayed under 'Recently
  Created Books.' Hey there! Just wanted to drop a quick note—make sure the 'Recently
  Created Books' section reflects accurately what you've been up to!
