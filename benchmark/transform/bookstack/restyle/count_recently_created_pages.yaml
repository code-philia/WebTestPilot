name: Count Recently Created Pages
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: A profile card with 'Created Content' is shown
  ground_truth: |
    expect(page.get_by_text("Created Content")).to_be_visible()
- action: Click 'View All' to the right of 'Recently Created Pages'
  expectation: The user's created pages is consistent with the previous 'Created Content'
    count
  ground_truth: |
    expect(page.get_by_role("heading", name="Search Results")).to_be_visible()
paragraph: To access your personal settings, you should click on the profile icon
  located at the top corner of the screen. Once you do this, a dropdown menu will
  emerge, featuring various profile options; among these, you'll find 'View Profile'.
  Next, proceed to select the 'View Profile' option from the list provided. Note that
  upon clicking it, a profile card will be displayed, which includes a section labeled
  'Created Content'. If you wish to explore further, simply click on 'View All' situated
  next to 'Recently Created Pages', and you'll be taken to a comprehensive list. Interestingly,
  the number of pages listed here should match exactly what was indicated under 'Created
  Content' previously, ensuring consistency in the user's content tracking. Should
  there be any discrepancies between the counts, it might indicate an issue with the
  content tracking system that needs addressing promptly.
