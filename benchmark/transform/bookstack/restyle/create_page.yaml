name: Create Page
setup_function: login_to_bookstack
steps:
- action: Click 'Books' link in navigation
  expectation: Books listing page appears
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
- action: Click on book title 'Book'
  expectation: Page contains title 'Book'
  ground_truth: |
    expect(page.get_by_role("heading", name="Book")).to_be_visible()
- action: Click on 'New Page' link
  expectation: WYSIWYG editor is present with 'New Page' as title
  ground_truth: |
    expect(page.get_by_role("textbox", name="Page Title")).to_have_value("New Page")
- action: Type 'New page content' in editor area
  expectation: Editor area contains typed text
  ground_truth: |
    expect(page.locator("iframe[title=\"Rich Text Area\"]").content_frame.locator("html")).to_contain_text("New page content")
- action: Click 'Save Page' button
  expectation: The new page should have no comments
  ground_truth: |
    expect(page.locator("#bkmrk-page-title")).to_be_visible()
paragraph: To begin your journey through the digital library, you'll want to click
  the 'Books' link found in the navigation bar. Next up, you're greeted with the Books
  listing page appearing before your eyes like a curtain rising on a stage. For those
  seeking specific instructions, simply click on the book title labeled 'Book'. It's
  worth noting for technical reference that the page you've navigated to will contain
  the title 'Book', confirming your successful arrival. If you're puzzled about what
  comes next, fear not—just click on the 'New Page' link to unravel the mystery. Imagine
  yourself as an author, with a WYSIWYG editor now at your fingertips, ready to craft
  your masterpiece titled 'New Page'. With a casual flair, type 'New page content'
  into the editor area, letting your thoughts flow freely. As if by magic, the editor
  area now contains the typed text, a testament to your creative endeavor. Finally,
  click the 'Save Page' button, sealing your work in digital amber. In the end, the
  new page should stand alone, free from any comments, a silent monument to your effort.
