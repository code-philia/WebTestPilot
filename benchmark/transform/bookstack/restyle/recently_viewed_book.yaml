name: Recently Viewed Book
setup_function: login_to_bookstack
steps:
- action: From the dashboard click "Books" link in navigation
  expectation: Page with title 'Books' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
- action: Click on book title "Book2"
  expectation: Page with title 'Book2' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
- action: Click on the Bookstack logo top left of navbar
  expectation: The 'Book2' item appears at the top of the "My Recently Viewed" list,
    whether it was already present or newly added. All other items retain their previous
    order
  ground_truth: expect(page.locator("#recently-viewed")).to_contain_text("Book2 Description")
paragraph: 'To begin your journey through the library''s digital collection, start
  by navigating to the ''Books'' section from the dashboard. Next, you should observe
  the page titled ''Books'' appearing before your eyes, ready for exploration. For
  detailed instructions, refer to step three: select the book titled "Book2" from
  the list provided. Imagine yourself diving into the world of "Book2", as the page
  bearing its name unfolds like a new chapter in your reading adventure. If you encounter
  any issues, simply click the Bookstack logo located at the top left corner of the
  navigation bar to return home. In the realm of user experience, it''s fascinating
  to note how the ''Book2'' item magically ascends to the pinnacle of the "My Recently
  Viewed" list, regardless of its prior status. Lastly, just for kicks, remember that
  all other entries in your recently viewed list will stubbornly hold onto their original
  positions, like old friends refusing to change seats.'
