name: Recent Activity Chapter
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Chapter 2' link
  expectation: The 'Recent Activity' (user, activity, timestamp data) consistent with
    the previous dashboard's 'Recent Activity' list
  ground_truth: expect(page.get_by_role("heading", name="Details")).to_be_visible()
paragraph: To begin, navigate from the dashboard and select the 'Chapter 2' link.
  Note that the 'Recent Activity' section displays user, activity, and timestamp data,
  mirroring what was previously observed on the dashboard's 'Recent Activity' list.
  For technical reference, ensure the consistency between the two 'Recent Activity'
  datasets is maintained across dashboards. If you encounter discrepancies, check
  the synchronization settings to resolve any issues. Once upon a time, a user journeyed
  through their dashboard, and upon clicking 'Chapter 2', they found the 'Recent Activity'
  as familiar as an old friend. Just a heads-up, folks, make sure when you hit 'Chapter
  2', your recent activities are still in sync like they should be!
