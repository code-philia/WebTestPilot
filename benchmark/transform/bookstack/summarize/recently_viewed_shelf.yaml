name: Recently Viewed Shelf
setup_function: login_to_bookstack
steps:
- action: From the dashboard click "Shelves" link in navigation
  expectation: Shelf listing page appears
  ground_truth: |
    expect(page.get_by_role("heading", name="Shelves", exact=True)).to_be_visible()
- action: Click on shelf title "Shelf"
  expectation: Shelf detail page opens
  ground_truth: |
    expect(page.get_by_role("heading", name="Shelf")).to_be_visible()
- action: Click on the Bookstack logo top left of navbar
  expectation: The 'Shelf' item appears at the top of the "My Recently Viewed" list,
    whether it was already present or newly added. All other items retain their previous
    order
  ground_truth: |
    expect(page.locator("#recently-viewed")).to_contain_text("Shelf")
paragraph: 'From dash, click ''Shelves'' -> Shelf list pg appears. Click ''Shelf''
  title -> Shelf detail pg opens. Click Bookstack logo (top L). ''Shelf'' shld appear
  @ top of ''My Recently Viewed'', new or existing. Other items keep prev order. #roughdraft'
