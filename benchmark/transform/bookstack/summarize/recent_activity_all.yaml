name: Recent Activity All
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  ground_truth: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
- action: Click on 'View Profile' option
  expectation: The 'Recent Activity' list is in chronological order
  ground_truth: expect(page.get_by_role("heading", name="Recent Activity")).to_be_visible()
paragraph: Click prof icon -> Dropdown w/ opts incl 'View Prof' -> Click 'View Prof'
  -> Check if 'Recent Act' list is chron order
