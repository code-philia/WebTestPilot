name: Convert Quote to Invoice
setup_function: login_to_invoiceninja
steps:
- action: Click 'Invoices' in the sidebar
  expectation: A table of invoices is displayed (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click 'Quotes' in the sidebar
  expectation: A table of quotes is displayed (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
- action: Click on the 'Status' dropdown
  expectation: A dropdown containing 'Sent' option is shown
  ground_truth: |
    expect(page.get_by_role("option", name="Sent")).to_be_visible()
- action: Click on the 'Sent' option
  expectation: The 'Sent' status tag is visible
  ground_truth: |
    expect(page.get_by_role("option", name="Sent")).not_to_be_visible()
- action: Click on the "Actions" button for quote number '123456' in the table
  expectation: A dropdown containing 'Convert to Invoice' option is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Convert to Invoice")).to_be_visible()
- action: Click on the 'Convert to Invoice' button
  expectation: The 'Convert to Invoice' button is not visible and its dropdown is
    no longer expanded
  ground_truth: |
    expect(page.get_by_text("Converted").first).to_be_visible()
- action: Click 'Invoices' in the sidebar
  expectation: The invoice table should contain all previous invoices with the same
    invoice number, client, amount, and date, plus one new invoice corresponding to
    the converted quote, which must match on client and amount (other fields may differ),
    so that the total row count is exactly one more than before
  ground_truth: expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
paragraph: 'To begin, you''ll want to navigate your cursor over to the ''Invoices''
  section located within the sidebar menu. Once selected, a comprehensive table of
  invoices will appear before your eyes—don''t worry about verifying the column details
  at this stage. Next up, follow these instructions carefully: click on ''Quotes''
  found in the sidebar. Reference material indicates that upon selection, a table
  of quotes will be presented to the user without the necessity of examining the column
  specifics. Now, let''s delve into the concept of statuses; proceed by clicking on
  the ''Status'' dropdown. If you encounter any issues, remember that a correctly
  functioning system will display a dropdown featuring the ''Sent'' option when you
  click there. Imagine yourself selecting the ''Sent'' option from the list—it’s like
  choosing a path in an adventure story. After making your choice, the ''Sent'' status
  tag should become visible, confirming your action. Moving along, casually tap the
  ''Actions'' button next to the quote numbered ''123456'' within the table. Aha!
  You''ve just revealed a dropdown with the intriguing ''Convert to Invoice'' option
  inside it. However, if you find that the ''Convert to Invoice'' button has vanished
  and its dropdown is no longer open, don’t panic—this is expected behavior post-selection.
  Lastly, make your way back to the ''Invoices'' section in the sidebar. At this juncture,
  the invoice table ought to encompass all prior invoices, maintaining consistency
  in invoice number, client, amount, and date, while also including one additional
  invoice that mirrors the converted quote in terms of client and amount, thereby
  ensuring the total number of rows has incremented by precisely one.'
