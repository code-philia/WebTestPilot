name: Mark Invoice as Paid
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is shown (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click on the invoice number '123456_sent'
  expectation: The 'Edit Invoice' page is shown (no need to check details)
  ground_truth: |
    expect(page.locator("#number")).to_have_value("123456_sent")
- action: Click on dropdown button to the right of 'Save'
  expectation: A dropdown containing 'Mark Paid' option is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Mark Paid")).to_be_visible()
- action: Click on the 'Mark Paid' button
  expectation: The invoice status is marked as 'Paid'
  ground_truth: |
    expect(page.get_by_text("Paid", exact=True)).to_be_visible()
- action: Click on 'Dashboard' in the sidebar
  expectation: The 'Upcoming Invoices' panel no longer contains any invoices
  ground_truth: expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
paragraph: 'To begin your journey through the invoicing system, start by navigating
  from the dashboard and tapping on ''Invoices'' nestled within the sidebar menu.
  Instructions for the next step are simple: once you''re presented with a table of
  invoices, there''s no need to scrutinize the columns—just keep an eye out for the
  invoice number ''123456_sent'' and give it a click. For those seeking a technical
  understanding, the ''Edit Invoice'' page will appear before you, but don''t worry
  about verifying the details at this stage. If you encounter issues, remember that
  clicking the dropdown button beside ''Save'' should reveal a list including the
  ''Mark Paid'' option; select it if the invoice status isn''t updating as expected.
  Once upon a time, after marking the invoice as paid, the system acknowledged its
  new status, and the invoice was officially labeled ''Paid''. Feeling relaxed? Just
  casually tap on ''Dashboard'' in the sidebar when you''re ready to wrap things up.
  And voila! The ''Upcoming Invoices'' panel has been magically cleared of any pending
  invoices, confirming the success of your task.'
