name: View Products
setup_function: login_to_invoiceninja
steps:
- action: Click 'Products' in the sidebar
  expectation: A table of products with 10 rows and pagination at the bottom is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Products")).to_be_visible()
paragraph: To begin, you should click on the 'Products' link located within the sidebar
  menu. Note that upon successful navigation, users are presented with a structured
  table consisting of exactly ten rows, accompanied by a pagination control situated
  at the lower edge of the display area. For those seeking technical details, the
  interface element in question is a standard HTML table with class attributes facilitating
  dynamic content loading and pagination functionality. If you're having trouble locating
  the 'Products' section, ensure that your sidebar is fully expanded and visible on
  the screen. Once the magical button is pressed, a wondrous array of product listings
  appears, inviting the user to explore further. Just a heads-up, folks, after you
  tap 'Products', keep an eye out for that neat little page number changer down below!
