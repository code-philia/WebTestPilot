name: View Invoice Details
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click the invoice number '123456'
  expectation: The invoiced products calculation is consistent with subtotal
  ground_truth: |
    expect(page.get_by_role("heading", name="Edit Invoice")).to_be_visible()
paragraph: To access the invoices, navigate from the dashboard to the 'Invoices' option
  located in the sidebar. A grid-like structure appears, displaying a comprehensive
  list of all invoices for your review. If you're looking to inspect a specific invoice,
  proceed by tapping on the identifier labeled '123456'. One might wonder how the
  total is derived; rest assured, the invoiced products' calculation aligns perfectly
  with the subtotal presented. Should you encounter discrepancies between the items
  listed and the total, double-check the invoice details for any overlooked charges.
  Once upon a time, a user followed these steps and was amazed at how smoothly the
  system handled their financial records. Just a heads up, folks, make sure everything
  looks right before you move on to the next task!
