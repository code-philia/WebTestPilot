name: Delete Payment
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Payments' in the sidebar
  expectation: A table of payments is shown (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Payments")).to_be_visible()
- action: Check the checkbox of the first row in the table
  expectation: The checkbox becomes checked, 'Actions' dropdown button becomes enabled
  ground_truth: |
    expect(page.get_by_role("button", name="Actions").first).to_be_enabled()
- action: Click on the 'Actions' dropdown button
  expectation: A dropdown containing 'Delete' option is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Delete")).to_be_visible()
- action: Click on the 'Delete' option
  expectation: The checked row is no longer visible
  ground_truth: |
    expect(page.get_by_role("cell", name="0001")).not_to_be_visible()
- action: Click on 'Dashboard' in the sidebar
  expectation: The 'Recent Payments' in dashboard should be equal to previous list
    minus the deleted payment
  ground_truth: expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
paragraph: To begin, you'll want to navigate from the dashboard by selecting 'Payments'
  located within the sidebar menu. Once you've done that, a table of payments will
  appear before your eyes—don't worry about verifying the columns just yet. For reference,
  ensure the checkbox in the initial row of the table is selected; this action will
  trigger the 'Actions' dropdown button to become active. If you're having trouble
  with the checkbox not checking, make sure there are no JavaScript errors blocking
  the interaction. Next up, proceed to click on the 'Actions' dropdown button, which
  will reveal a list including the 'Delete' option. In a thrilling turn of events,
  select the 'Delete' option, and watch as the chosen row vanishes from sight like
  magic. Now, casually click on 'Dashboard' over in the sidebar, as if it's just another
  day at the office. Finally, the 'Recent Payments' section on the dashboard ought
  to reflect the updated list, excluding the payment you just dispatched into oblivion.
