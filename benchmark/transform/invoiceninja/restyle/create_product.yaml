name: Create Product
setup_function: login_to_invoiceninja
steps:
- action: Click 'Products' in the sidebar
  expectation: A table of products is shown (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Products")).to_be_visible()
- action: Click on 'New Product' button
  expectation: A form with title 'New Product' is shown (no need to check fields)
  ground_truth: |
    expect(page.get_by_role("link", name="New Product")).to_be_visible()
- action: Type 'New Product' in 'Item' field
  expectation: Item field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox").first).to_have_value("New Product")
- action: Type '120' in 'Price' field
  expectation: Price field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox").nth(2)).to_have_value("120")
- action: Type '1' in 'Default Quantity' field
  expectation: Default quantity field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox").nth(3)).to_have_value("1")
- action: Click on 'Save'
  expectation: A new 'Status' field appears in form with 'Active' tag. Tax field is
    consistent with previous form.
  ground_truth: expect(page.get_by_text("Active")).to_be_visible()
paragraph: To begin, you'll want to focus your attention on the sidebar where you
  should click the 'Products' link. Next up, a table of products will appear before
  your eyes—don't worry about verifying the columns just yet. For those looking for
  detailed instructions, proceed by clicking the 'New Product' button now. Understand
  that what follows is a form titled 'New Product,' which you don’t need to inspect
  closely for its fields. Once there, let your fingers dance over the keyboard and
  type 'New Product' into the 'Item' field; rest assured, the field will hold onto
  your input like a sponge absorbs water. If you're ever stuck, remember that checking
  if the 'Item' field contains the text you typed can be a quick fix. Moving along,
  enter '120' into the 'Price' field, ensuring it captures your entry faithfully.
  Imagine a scenario where you type '1' into the 'Default Quantity' field, and magically,
  the field mirrors your input back at you. Afterward, simply click on 'Save,' and
  voila! A new 'Status' field pops up in the form, proudly displaying an 'Active'
  tag. Lastly, for all tech enthusiasts out there, the Tax field remains unchanged
  from the previous form, maintaining consistency.
