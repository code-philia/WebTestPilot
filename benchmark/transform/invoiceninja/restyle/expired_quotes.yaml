name: Expired Quotes
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Quotes' in the sidebar
  expectation: The 'Expired' quote number(s) is consistent with 'Expired Quotes' on
    the dashboard
  ground_truth: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
paragraph: 'To begin, navigate to the ''Quotes'' section by clicking its icon within
  the sidebar menu on your dashboard. If you''re looking for guidance, remember: expired
  quotes should match the count shown under ''Expired Quotes'' on your main screen.
  For technical reference, ensure the numerical value beside ''Expired'' aligns perfectly
  with the dashboard''s ''Expired Quotes'' display. Wondering how to verify this?
  Simply compare the two figures to confirm they are identical. Once upon a time,
  a user noticed that the expired quotes listed matched exactly what was shown on
  their dashboard, ensuring everything was in order. And hey, just make sure when
  you glance over there, the numbers jive—no discrepancies allowed!'
