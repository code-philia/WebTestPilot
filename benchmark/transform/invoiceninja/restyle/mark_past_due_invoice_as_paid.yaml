name: Mark Past Due Invoice as Paid
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is shown (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click on the invoice number '123456_past_due'
  expectation: The 'Edit Invoice' page is shown
  ground_truth: |
    expect(page.locator("#number")).to_have_value("123456_past_due")
- action: Click on dropdown button to the right of 'Save'
  expectation: A dropdown containing 'Mark Paid' option is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Mark Paid")).to_be_visible()
- action: Click on the 'Mark Paid' button
  expectation: The invoice status is marked as 'Paid'
  ground_truth: |
    expect(page.get_by_text("Paid", exact=True)).to_be_visible()
- action: Click on 'Dashboard' in the sidebar
  expectation: The 'Past Due Invoices' panel no longer contains any invoices
  ground_truth: expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
paragraph: To begin, you'll want to navigate from the dashboard by selecting 'Invoices'
  located within the sidebar menu. Once there, a grid of invoices appears before your
  eyes—don't worry about inspecting the column details just yet. Next up, focus your
  attention on the invoice labeled '123456_past_due' and give it a good click. Now,
  you should find yourself on the 'Edit Invoice' page; it's like entering a new realm
  dedicated to invoice adjustments. To proceed, locate the dropdown button adjacent
  to the 'Save' option—it’s your gateway to further actions. A list will emerge from
  this dropdown, revealing the 'Mark Paid' choice among its options. Select the 'Mark
  Paid' button with confidence, transforming the invoice's status to 'Paid' in an
  instant. After marking the invoice, take a stroll back to the 'Dashboard' via the
  sidebar for a final check. Lo and behold, the 'Past Due Invoices' section has been
  cleared out, devoid of any lingering entries.
