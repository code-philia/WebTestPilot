name: View Quote Details
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Quotes' in the sidebar
  expectation: A table of quotes is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
- action: Click on the quote number '123456'
  expectation: The quoted products calculation is consistent with subtotal
  ground_truth: |
    expect(page.get_by_role("heading", name="Edit Quote")).to_be_visible()
paragraph: To access the quotes section, navigate from the dashboard to the 'Quotes'
  option located in the sidebar. A grid-like structure appears, displaying an array
  of quotes for your review. If you're looking for a specific quote, simply tap on
  the identifier labeled '123456'. It's crucial to ensure that the computation of
  the quoted items aligns perfectly with the subtotal amount listed. Should you encounter
  discrepancies between the calculated total and the subtotal, double-check the entries
  for any errors. Once upon a time, a user followed these steps and was amazed at
  how smoothly the system handled their quote requests. Just a heads-up, folks, make
  sure everything adds up correctly when you're dealing with those numbers!
