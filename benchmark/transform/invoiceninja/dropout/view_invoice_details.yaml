name: View Invoice Details
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click the invoice number '123456'
  expectation: The invoiced products calculation is consistent with subtotal
  ground_truth: |
    expect(page.get_by_role("heading", name="Edit Invoice")).to_be_visible()
paragraph: From the dashboard click 'Invoices' in the sidebar. Click the invoice number
  '123456'. The invoiced products calculation is consistent with subtotal.
