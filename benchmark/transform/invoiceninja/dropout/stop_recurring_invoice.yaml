name: Stop Recurring Invoice
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Recurring Invoices' in the sidebar
  expectation: A table of recurring invoices is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Recurring Invoices")).to_be_visible()
- action: Check the checkbox of recurring invoice number '123456' in the table
  expectation: The checkbox becomes checked, 'Actions' dropdown button becomes enabled
  ground_truth: |
    expect(page.get_by_role("button", name="Actions").first).to_be_enabled()
- action: Click on the 'Actions' dropdown button
  expectation: A dropdown containing 'Stop' option is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Stop")).to_be_visible()
- action: Click on the 'Stop' button
  expectation: The status of the invoice changes to 'Paused'
  ground_truth: |
    expect(page.get_by_text("Paused")).to_be_visible()
- action: Click on 'Dashboard' in the sidebar
  expectation: The 'Upcoming Recurring Invoices' panel no longer contains invoices
  ground_truth: expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
paragraph: From the dashboard click 'Recurring Invoices' in the sidebar. A table of
  recurring invoices is shown. Check the checkbox of recurring invoice number '123456'
  in the table. The checkbox becomes checked, 'Actions' dropdown button becomes enabled.
  A dropdown containing 'Stop' option is shown. Click on the 'Stop' button. The status
  of the invoice changes to 'Paused'. Click on 'Dashboard' in the sidebar. The 'Upcoming
  Recurring Invoices' panel no longer contains invoices.
