  panel titles or subtitles). Click on 'Payment Settings' in the sidebar. Page with
  title 'Payment Settings' on topmost bar and 'One-Page Checkout' toggle button in
  page is shown (no need to check panel titles or subtitles). Click on 'Product Settings'
  in the sidebar. Page with title 'Product Settings' on topmost bar and 'Convert Products'
  toggle button in page is shown (no need to check panel titles or subtitles). Click
  on 'Expense Settings' in the sidebar. Page with title 'Expense Settings' on topmost
  bar and 'Inclusive Taxes' toggle button in page is shown (no need to check panel
  titles or subtitles). Click on 'Workflow Settings' in the sidebar. Page with title
  'Workflow Settings' on topmost bar and 'Lock Invoices' dropdown field in page is
  shown (no need to check panel titles or subtitles). Page with title 'Import | Export'  on
  topmost bar and 'Export' section in page is shown (no need to check panel titles
  or subtitles). Click on 'Backup | Restore' in the sidebar. Page with title 'Backup
  | Restore' on topmost bar and 'Export' button in page is shown (no need to check
  panel titles or subtitles).
