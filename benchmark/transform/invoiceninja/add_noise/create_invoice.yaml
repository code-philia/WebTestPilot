name: Create Invoice
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is displayed (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
- action: Click 'New Invoice'
  expectation: A 'New Invoice' form with 'Create' tab is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="New Invoice")).to_be_visible()
- action: Click 'company_name' in 'Client' dropdown
  expectation: The contacts for client is shown
  ground_truth: |
    expect(page.get_by_text("Contacts")).to_be_visible()
- action: Click '+ Add Item'
  expectation: A line with quantity 1 is present
  ground_truth: |
    expect(page.get_by_role("cell").first).to_be_visible()
- action: Type '200' in 'Unit Cost'
  expectation: The unit cost is updated as 200
  ground_truth: |
    expect(page.locator('input[value="200"]')).to_be_visible()
- action: Click 'Save'
  expectation: Saved invoice has subtotal of 200
  ground_truth: |
    expect(page.get_by_text("Draft")).to_be_visible()
