name: Recent Transactions Expenses
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Expenses' in the sidebar
  expectation: A table of expenses is shown (no need to check columns)
  ground_truth: |
    expect(page.get_by_role("heading", name="Expenses")).to_be_visible()
- action: Click 'Enter Expense' button
  expectation: Enter expense form with taxes panel is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Enter Expense")).to_be_visible()
- action: Type '120000' in 'Amount'
  expectation: Amount field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox").first).to_have_value("120,000")
- action: Click 'Save'
  expectation: Expense total panel is shown
  ground_truth: |
    expect(page.get_by_text("Expense Total")).to_be_visible()
- action: Click on 'Dashboard' in the sidebar
  expectation: Invoices, payments, expenses, and outstanding in 'Recent Transactions'
    in dashboard is equal to before plus the new expense
  ground_truth: expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
