name: Localization
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click the company logo on the top left
  expectation: A dropdown containing 'Account Management' option is shown
  ground_truth: |
    expect(page.get_by_text("Account Management")).to_be_visible()
- action: Click on 'Account Management' option
  expectation: Page with title 'Account Management' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Account Management")).to_be_visible()
- action: Click on 'Localization' in the sidebar
  expectation: The currency three-letter code and the date format (in Python strftime)
    are consistent with the dashboard
  ground_truth: expect(page.get_by_role("heading", name="Localization")).to_be_visible()
paragraph: From dash, clk cmpny logo @ top L. Dropdown -> 'Acct Mgmt'. Clk 'Acct Mgmt'.
  Page titled 'Acct Mgmt' shld appear. Clk 'Localization' in sidebar. Verify curr
  3-ltr code & date fmt (Python strftime) match dash. Rough draft.
