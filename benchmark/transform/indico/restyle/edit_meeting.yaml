name: Edit Meeting
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'PhD Research Group Monthly Meeting'
  expectation: The details of the meeting (date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading")).to_contain_text("PhD Research Group Monthly Meeting")
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: A sidebar with 'Advanced Options' tab is shown
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click on the edit icon at the end of title
  expectation: Event title and description become editable fields
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_be_visible()
- action: Type 'Updated Meeting 1' in 'Event title' field
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("Updated Meeting 1")
- action: Scroll down
  expectation: Save button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
- action: Click 'Save' button
  expectation: The 'Title' field contains 'Updated Meeting 1'
  ground_truth: |
    expect(page.locator("#event-settings-data")).to_contain_text("Updated Meeting 1")
- action: Scroll up
  expectation: Home button is visible in top navigation bar
  ground_truth: |
    expect(page.locator("#global-menu").get_by_role("link", name="Home")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events are preserved and unchanged except for the title change
    of one event from 'PhD Research Group Monthly Meeting' to 'Updated Meeting 1'
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: In the 'All Events' section, you'll find an entry named 'PhD Research Group
  Monthly Meeting'; select it to view its specifics. To access the event's management
  area, simply locate and click the pen icon in the top navigation bar—a straightforward
  step for any user. Note that upon entering the management area, a sidebar will appear,
  featuring an 'Advanced Options' tab for your reference. Once there, a narrative
  unfolds where you encounter an edit icon beside the title; clicking it transforms
  the event title and description into editable fields. Explanatory in nature, understand
  that typing 'Updated Meeting 1' into the 'Event title' field updates the event's
  name accordingly. Confirm that the event title field now holds the newly typed text,
  ensuring accuracy. Scroll down the page, and you'll spot the 'Save' button—ready
  for action. Troubleshoot any hesitation by clicking the 'Save' button, solidifying
  the changes made. Verify that the 'Title' field now proudly displays 'Updated Meeting
  1', marking the successful update. Scroll up the page casually, noticing the home
  button in the top navigation bar waiting to be clicked. With a final instructional
  note, click 'Home' in the top navigation bar to return to the main view. Rest assured,
  all events remain intact and unchanged, save for the one event whose title has been
  refreshed from 'PhD Research Group Monthly Meeting' to 'Updated Meeting 1'.
