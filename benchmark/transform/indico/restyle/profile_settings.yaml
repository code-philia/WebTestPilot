name: Profile Settings
setup_function: login_to_indico
steps:
- action: Click on 'My profile' in top navigation bar
  expectation: A page with title 'Dashboard' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Admin User")).to_be_visible()
- action: Click on 'Settings' button
  expectation: My profile settings form with 'Email address' field is shown
  ground_truth: |
    expect(page.get_by_role("textbox", name="First name *")).to_have_value("Admin")
- action: Click on 'Preferences' in the sidebar
  expectation: My preferences form with 'Save' button is shown
  ground_truth: |
    expect(page.get_by_role("main")).to_contain_text("Preferences")
- action: Click on 'Data export' in the sidebar
  expectation: An 'Export my data' button is shown
  ground_truth: |
    expect(page.locator("#data-export-container")).to_contain_text("Data export")
- action: Click on 'Favourites' in the sidebar
  expectation: An 'Add Indico user' button is shown
  ground_truth: |
    expect(page.get_by_role("main")).to_contain_text("Favorite Users")
paragraph: To begin your journey through the interface, you should click on 'My profile'
  located in the top navigation bar. Next up, a page titled 'Dashboard' will appear
  before your eyes; there's no need to delve into its specifics at this moment. For
  those seeking guidance, proceed by clicking the 'Settings' button now. Understand
  that once you do, the My profile settings form will reveal itself, complete with
  an 'Email address' field for your perusal. Should you encounter any issues, remember
  that clicking on 'Preferences' within the sidebar will lead you to the My preferences
  form, where a 'Save' button awaits your command. Let’s move along the path by clicking
  on 'Data export' in the sidebar, which will unveil an 'Export my data' button for
  your convenience. In a twist of events, when you select 'Favourites' from the sidebar,
  an 'Add Indico user' button magically appears.
