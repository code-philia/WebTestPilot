name: View Lecture Details
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 2 w/ Survey'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 2 w/ Survey")).to_be_visible()
- action: Click on the 'Home' icon
  expectation: The event titles (normalized and without newlines) in 'All Events'
    (past, present, and future) are currently exactly the same as they were initially
  ground_truth: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: To access the desired content, navigate from 'All Events' to 'Lecture 2
  w/ Survey', ensuring you're following the correct path through the interface. Note
  that upon selection, a comprehensive list including the lecturer's name, the scheduled
  date, and the specific venue for the lecture will be displayed for your reference.
  Should you wish to return to the main page, simply click on the 'Home' icon located
  at the top left corner of your screen. Interestingly, it has been observed that
  the event titles listed under 'All Events'—covering past, present, and future events—are
  meticulously maintained in their original form, free from any newlines and perfectly
  normalized just as they were when first introduced. If you encounter discrepancies
  between the current list and the initial one, double-check the settings and ensure
  no filters have been inadvertently applied that could alter the display. Once upon
  a time, a user found themselves in a similar situation, only to realize that the
  system was designed to keep all event titles consistent throughout, making navigation
  a breeze. And hey, just a heads up, folks—the event titles in 'All Events' are like
  old friends; they never change, always there with the same familiar names, no surprises!
