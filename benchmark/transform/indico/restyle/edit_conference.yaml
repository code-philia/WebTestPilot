name: Edit Conference
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Conference 1'
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#main-content").get_by_text("Registration", exact=True)).to_be_visible()
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: A sidebar with 'Advanced Options' tab is shown
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click on the edit icon at the end of title
  expectation: Event title and description become editable fields
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_be_visible()
- action: Type 'Updated Conference 1' in 'Event title' field
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("Updated Conference 1")
- action: Scroll down
  expectation: Save button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
- action: Click 'Save' button
  expectation: The 'Title' field contains 'Updated Conference 1'
  ground_truth: |
    expect(page.locator("#event-settings-data")).to_contain_text("Updated Conference 1")
- action: Scroll up
  expectation: Home button is visible in top navigation bar
  ground_truth: |
    expect(page.locator("#global-menu").get_by_role("link", name="Home")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events are preserved and unchanged except for the title change
    of one event from 'Conference 1' to 'Updated Conference 1'
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: In the 'All Events' section, you'll find an array of gatherings, but today,
  our focus is on 'Conference 1'. To access the management area, simply locate and
  tap the pen icon nestled within the top navigation bar—this action will transport
  you to the administrative realm of the event. For those seeking technical guidance,
  be aware that upon entry, a sidebar emerges, featuring a tab labeled 'Advanced Options'.
  Once there, a narrative unfolds where you encounter an edit icon, quietly residing
  at the tail end of the title; give it a click. Explanatory notes reveal that after
  clicking, the event title and its accompanying description transform into editable
  fields, awaiting your input. Proceed to type 'Updated Conference 1' into the 'Event
  title' field, ensuring your words replace any pre-existing text. Confirming the
  presence of your newly typed title, scroll down the page until your eyes meet the
  'Save' button, a beacon of finality in this digital odyssey. With a firm click on
  the 'Save' button, the system acknowledges your changes, embedding 'Updated Conference
  1' into the 'Title' field permanently. Now, as if retracing your steps in a storybook,
  scroll back up the page. Notice the 'Home' button, a steadfast fixture in the top
  navigation bar, ready to guide you back to the main stage. A casual glance confirms
  all events remain untouched and unaltered, save for the singular transformation
  of 'Conference 1' to 'Updated Conference 1', a testament to the power of a few keystrokes.
