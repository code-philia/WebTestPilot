name: Favourite Lecture
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 1'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 1")).to_be_visible()
- action: Click 'Add event to favourites' (star) icon
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.locator("#favorite-link > button.i-button")).to_have_attribute("title", "Delete event from favorites")
- action: Click on the 'Home' icon
  expectation: Only the 'Admin User, Lecture 1' is favourited (indicated by a star
    next to the title or a red title text) in event list
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To begin your journey through the lecture series, navigate from the ''All
  Events'' section and select ''Lecture 1''. Note carefully: upon clicking, you will
  be presented with comprehensive details about the lecture, including the lecturer''s
  name, the scheduled date, and the specific venue. For those who wish to keep this
  lecture close at heart, simply tap the ''Add event to favourites'' button, which
  is cleverly disguised as a star icon. Remember, after adding it to your favourites,
  the same detailed information regarding the lecture will appear once more for your
  convenience. Should you find yourself lost, just click on the ''Home'' icon to return
  to the main page. In the event list, you''ll notice a special distinction: only
  the ''Admin User, Lecture 1'' has been marked as a favourite, easily identifiable
  by either a star beside its title or a title text in red, ensuring you never lose
  track of your cherished content.'
