name: Clonet Event
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 1'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 1")).to_be_visible()
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: A sidebar with 'Advanced Options' tab is shown
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click 'Clone' button
  expectation: A modal with title 'Clone Event is shown'
  ground_truth: |
    expect(page.get_by_label("Clone Event").get_by_text("Clone Event")).to_be_visible()
- action: Click 'Clone Once'
  expectation: The 'Clone Once' radio button is selected
  ground_truth: |
    expect(page.get_by_label("Clone Event").get_by_text("Clone Event")).to_be_visible()
- action: Click 'Next'
  expectation: The text 'What should be cloned?' is visible
  ground_truth: |
    expect(page.get_by_text("What should be cloned?")).to_be_visible()
- action: Click 'Next'
  expectation: The text 'Where should the events be placed?' is visible
  ground_truth: |
    expect(page.get_by_text("Where should the events be")).to_be_visible()
- action: Click 'Next'
  expectation: The text 'Clone Once' is visible
  ground_truth: |
    expect(page.get_by_text("Clone Once")).to_be_visible()
- action: Click 'Clone'
  expectation: A success message 'Welcome to your cloned event!' is shown
  ground_truth: |
    expect(page.locator("div").filter(has_text="Welcome to your cloned event!").nth(5)).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the cloned event
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'In the ''All Events'' section, you''ll find an entry named ''Lecture 1'';
  give it a click. To access the management features for this event, navigate your
  cursor over to the top navigation bar and tap on the pen icon, which will whisk
  you away to the event''s management area. For those seeking technical guidance,
  a sidebar emerges, featuring a tab labeled ''Advanced Options.'' Imagine a scenario
  where you''re ready to duplicate this event; simply press the ''Clone'' button,
  and voila! A dialog box pops up, proudly displaying the title ''Clone Event.'' If
  you''re wondering how to proceed, just select the ''Clone Once'' option, ensuring
  it''s checked off before moving forward. With everything set, hit ''Next,'' and
  you''ll encounter the question, ''What should be cloned?''. As if on a journey,
  press ''Next'' again, and you''ll face another prompt asking, ''Where should the
  events be placed?''. Keep clicking ''Next,'' and you''ll eventually see the familiar
  ''Clone Once'' option once more. Finally, press ''Clone,'' and a delightful message
  greets you: ''Welcome to your cloned event!''. Feeling accomplished, head back to
  the ''Home'' button in the top navigation bar. And there you have it—a list of all
  events now includes the newly cloned one, matching the original count plus this
  addition.'
