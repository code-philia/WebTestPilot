name: Delete Meeting
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'PhD Research Group Monthly Meeting'
  expectation: The details of the meeting (date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading")).to_contain_text("PhD Research Group Monthly Meeting")
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: The text 'Advanced options' is visible on the left of the page
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click on the gear icon to the right of 'Clone'
  expectation: A dropdown containing 'Delete' action is shown
  ground_truth: |
    expect(page.get_by_role("button", name="Delete", exact=False)).to_be_visible()
- action: Click on 'Delete' in the dropdown
  expectation: A delete confirmation dialog with title starting with 'You are about
    to delete the whole event' is shown
  ground_truth: |
    expect(page.get_by_text("I understand what this means")).to_be_visible()
- action: Click on 'I understand what this means. Please go ahead.' checkbox
  expectation: Delete event button is enabled
  ground_truth: |
    expect(page.get_by_role("checkbox", name="I understand what this means")).to_be_checked()
- action: Click 'Delete event'
  expectation: After deleting an event, the remaining event titles should match the
    initial “All Events” list with the deleted event removed; for comparison, each
    title must be normalized by removing an optional organizer prefix followed by
    a comma and quotation marks if present (i.e., titles may be in the form Organizer,
    "Event" or just Event), then truncating the resulting title to the first 30 characters.
  ground_truth: |
    expect(page.get_by_role("heading", name="Events")).to_be_visible()
paragraph: In the 'All Events' section, you'll find a listing where you should select
  'PhD Research Group Monthly Meeting', embarking on a journey through the calendar's
  offerings. To access the meeting specifics such as the date and location, simply
  tap on the event name, unveiling all necessary information at your fingertips. For
  those seeking control over their schedule, navigate to the top navigation bar and
  press the pen icon, thus entering the event's management console like a captain
  steering his ship. Notably, the phrase 'Advanced options' appears on the left side
  of the interface, serving as a beacon for further customization. Should you wish
  to explore more settings, locate the gear icon adjacent to 'Clone' and give it a
  click, revealing a dropdown menu with various actions including 'Delete'. Upon selecting
  'Delete' from the dropdown, a confirmation dialog emerges, its title ominously beginning
  with 'You are about to delete the whole event', prompting a final decision. Before
  proceeding, ensure the checkbox labeled 'I understand what this means. Please go
  ahead.' is checked, enabling the 'Delete event' button as if unlocking a secret
  passage. With the button now active, press 'Delete event' to remove the meeting
  from your calendar, a simple yet decisive action. Post-deletion, verify that the
  list of events aligns with the original 'All Events' but excludes the one you've
  just erased; for accurate comparison, normalize each title by stripping any organizer
  prefix, commas, and quotation marks, then shorten the result to the first 30 characters,
  ensuring consistency across the board.
