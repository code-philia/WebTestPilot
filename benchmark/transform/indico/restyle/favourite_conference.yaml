name: Favourite Conference
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Conference 1'
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#main-content").get_by_text("Registration", exact=True)).to_be_visible()
- action: Click 'Add event to favourites' (star) icon
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#favorite-link > button.i-button")).to_have_attribute("title", "Delete event from favorites")
- action: Click on the 'Home' icon
  expectation: Only the 'Conference 1' is favourited (indicated by a star next to
    the title or a red title text) in event list
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To begin your journey through the event interface, you should navigate
  from the ''All Events'' section and select ''Conference 1''. Note carefully: once
  selected, the conference''s specifics, including its date and venue, will be displayed
  for your review. Next, proceed to tap the ''Add event to favourites'' button, which
  is cleverly disguised as a star icon. For your reference, after adding it to your
  favourites, the same details about the conference—its date and venue—will appear
  again, confirming your action. If you encounter any issues where the details do
  not show up, ensure that you have indeed clicked the star icon correctly. Now, let’s
  move on to the next step in our little adventure; tap the ''Home'' icon to return
  to the main screen. In the end, you''ll find that only ''Conference 1'' has been
  marked as a favourite, easily identifiable by either a star beside its title or
  its title text turning red, making it stand out in the event list like a beacon.'
