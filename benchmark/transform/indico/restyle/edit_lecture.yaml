name: Edit Lecture
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 1'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 1")).to_be_visible()
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: A sidebar with 'Advanced Options' tab is shown
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click on the edit icon at the end of title
  expectation: Event title and description become editable fields
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_be_visible()
- action: Type 'Updated Lecture 1' in 'Event title' field
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("Updated Lecture 1")
- action: Scroll down
  expectation: Save button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
- action: Click 'Save' button
  expectation: The 'Title' field contains 'Updated Lecture 1'
  ground_truth: |
    expect(page.locator("#event-settings-data")).to_contain_text("Updated Lecture 1")
- action: Scroll up
  expectation: Home button is visible in top navigation bar
  ground_truth: |
    expect(page.locator("#global-menu").get_by_role("link", name="Home")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events are preserved and unchanged except for the title change
    of one event from 'Lecture 1' to 'Updated Lecture 1'
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To embark on this journey through the digital realm, one must first navigate
  to ''Lecture 1'' from the ''All Events'' section, like a traveler seeking a hidden
  treasure. Next, follow these precise instructions: after the details of the lecture
  appear before your eyes—featuring the lecturer, date, and venue—reach out and click
  the pen icon nestled within the top navigation bar to unlock the event''s management
  area. For those in need of a technical guide, know that upon successful interaction,
  a sidebar shall emerge, revealing an ''Advanced Options'' tab for further exploration.
  Should you find yourself in a quandary about how to proceed, simply locate and click
  the edit icon positioned at the tail end of the title, transforming the event title
  and description into editable fields ripe for modification. Imagine now, the cursor
  poised over the ''Event title'' field; type ''Updated Lecture 1'', and watch as
  the field absorbs the new text like a sponge. Confirming the presence of the typed
  text in the event title field, you then embark on a downward scroll, akin to descending
  a staircase in search of the elusive ''Save'' button. Upon spotting the ''Save''
  button, a beacon of completion, click it without hesitation, ensuring the ''Title''
  field now proudly displays ''Updated Lecture 1''. As you ascend back up the page,
  much like a climber returning from a peak, the ''Home'' button in the top navigation
  bar becomes your next target. With a final click on ''Home'', you return to the
  main stage where all events remain untouched and unaltered, save for the singular
  transformation of ''Lecture 1'' to its updated form, ''Updated Lecture 1''.'
