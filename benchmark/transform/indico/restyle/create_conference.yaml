name: Create Conference
setup_function: login_to_indico
steps:
- action: Click 'Create event' in the top navigation bar
  expectation: A dropdown is shown with three options for creating a lecture, a meeting,
    or a conference
  ground_truth: |
    expect(page.get_by_role("link", name="Create conference").or_(page.get_by_role("link", name="Conference", exact=True))).to_be_visible()
- action: Click option to create conference in dropdown
  expectation: A dialog form with title 'Create new conference' is shown (no need
    to check details)
  ground_truth: |
    expect(page.get_by_text("Create new conference")).to_be_visible()
- action: Type 'New Conference' in 'Event title'
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("New Conference")
- action: Set 'Protection mode' to 'Public'
  expectation: A dialog form with title 'Create new conference' is shown (no need
    to check details)
  ground_truth: |
    expect(page.locator("#form-group-event-creation-protection_mode")).to_contain_text("The event will be publicly accessible since it is set as public.")
- action: Click 'Create event'
  expectation: An event settings page for the created event is shown
  ground_truth: |
    expect(page.locator(".title-with-actions")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the created event
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To initiate the process, one must interact with the ''Create event'' button
  located within the top navigation bar. Next, you will observe a dropdown menu presenting
  you with three distinct choices: crafting a lecture, organizing a meeting, or establishing
  a conference. For technical guidance, select the ''conference'' option from the
  dropdown to proceed. Imagine a scene where a dialog box magically appears, proudly
  displaying the heading ''Create new conference''—don''t worry about inspecting its
  contents just yet. Now, fill in the ''Event title'' field with the phrase ''New
  Conference'', ensuring your input is accurately reflected. Transitioning into a
  more conceptual explanation, the ''Protection mode'' setting needs to be adjusted
  to ''Public'' to align with our requirements. Once again, a dialog form titled ''Create
  new conference'' makes an appearance; however, we''ll bypass detailed examination
  this time around. Execute the final step by clicking the ''Create event'' button
  to solidify your creation. Upon successful execution, you are transported to the
  event settings page, a testament to your newly minted event. Navigate back to the
  ''Home'' section via the top navigation bar to conclude your journey. Lastly, if
  everything has gone according to plan, the list of all events should now include
  the newly added conference, expanding the initial roster.'
