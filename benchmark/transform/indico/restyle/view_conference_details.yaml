name: View Conference Details
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Conference 1'
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#main-content").get_by_text("Registration", exact=True)).to_be_visible()
- action: Click on the 'Home' icon
  expectation: The event titles (normalized and without newlines) in 'All Events'
    (past, present, and future) are currently exactly the same as they were initially
  ground_truth: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: To begin, navigate through the interface by selecting 'Conference 1' from
  the 'All Events' list. Note that upon selection, you will be presented with specific
  information regarding the conference, including its date and venue. For your next
  step, ensure you click on the 'Home' icon to return to the main page. It's important
  to understand that the event titles listed under 'All Events', which have been normalized
  and stripped of any newlines, should remain consistent with their initial state
  for both past and present events, as well as those scheduled for the future. If
  you encounter discrepancies between the current event titles and their original
  form, refer to the troubleshooting guide for potential solutions. Once upon a time,
  a user embarked on a journey through an event management system, where they discovered
  that the titles of all events remained unchanged, just like the stars in the night
  sky. Hey there! Just wanted to drop a quick note—make sure everything looks the
  same as it did at the start when you're checking out those event titles!
