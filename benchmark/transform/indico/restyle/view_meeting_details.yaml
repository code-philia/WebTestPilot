name: View Meeting Details
setup_function: login_to_indico
steps:
- action: Scroll down
  expectation: A list of events is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="January")).to_be_visible()
- action: Click 'Meeting 1'
  expectation: The details of the meeting (date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Meeting")).to_be_visible()
- action: Click on the 'Home' icon
  expectation: The event titles (normalized and without newlines) in 'All Events'
    (past, present, and future) are currently exactly the same as they were initially
  ground_truth: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To proceed with the task, you must scroll down first. Imagine a scenario
  where a list of events magically appears before your eyes after scrolling. For detailed
  information about ''Meeting 1'', kindly click on it as instructed. Note: Upon clicking,
  the system will display the meeting''s date and venue for your reference. If you
  wish to return to the main page, simply click on the ''Home'' icon provided. Be
  aware that any discrepancies in event titles within ''All Events'' could indicate
  a synchronization issue; ensure they match the initial list for accuracy. Once upon
  a time, there was a user who noticed all event titles, past, present, and future,
  remained unchanged from their original form, sans newlines, in the ''All Events''
  section. Hey there! Just a heads-up—the event titles in ''All Events'' should be
  identical to how they started out, normalized and free of any pesky newlines.'
