name: Create News
setup_function: login_to_indico
steps:
- action: Click on 'Administration' in the top navigation bar
  expectation: A message 'A new Indico version...' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="General Settings")).to_be_visible()
- action: Click on 'Homepage' in the sidebar
  expectation: The 'Homepage' section is expanded (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Announcement")).to_be_visible()
- action: Click on 'News' under 'Homepage' in the sidebar
  expectation: A page with title 'News' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_text("News").nth(2)).to_be_visible()
- action: Click on the 'Post news' button
  expectation: A modal with title 'Post news' is shown
  ground_truth: |
    expect(page.get_by_label("Post news").get_by_text("Post news")).to_be_visible()
- action: Type 'Some News' in the 'Title' field
  expectation: The 'Title' field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Title")).to_have_value("Some News");
- action: Type 'News Content' in the 'Content' field
  expectation: The 'Content' field contains typed text
  ground_truth: |
    expect(page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_role("paragraph")).to_contain_text("News Content")
- action: Scroll down
  expectation: A 'Save' button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
- action: Click 'Save'
  expectation: A 'News 'Some News' has been posted' success message is shown
  ground_truth: |
    expect(page.locator("div").filter(has_text="News 'Some News' has been").nth(4)).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: To begin, one must navigate their cursor over to the 'Administration' option
  located within the top navigation bar and give it a click. If you're wondering what
  happens next, a notification will pop up, displaying the text 'A new Indico version...'.
  For those looking for step-by-step guidance, proceed by selecting the 'Homepage'
  link found in the sidebar menu. In technical terms, the 'Homepage' section will
  then expand automatically, relieving you from the duty of verifying its contents.
  Once you've reached this point in your journey, a natural progression would be to
  tap on 'News', which is conveniently listed under 'Homepage' in the sidebar. Imagine
  your surprise when a page titled 'News' appears before your eyes, though there's
  no need to delve into its specifics. Now, if you're ready to post some news, simply
  locate and press the 'Post news' button. Upon doing so, a dialog box titled 'Post
  news' will materialize out of nowhere. Enter 'Some News' into the 'Title' field,
  ensuring that the text you input is indeed reflected there. With the 'Title' field
  now filled, shift your focus to the 'Content' field and type 'News Content', making
  sure the field captures your entry accurately. As you scroll down the page, keep
  an eye out for the 'Save' button, which should become visible soon enough. Should
  you encounter any issues at this stage, clicking 'Save' will resolve them by posting
  your news item. Afterward, a confirmation message stating 'News 'Some News' has
  been posted' will appear, assuring you of the successful operation. To conclude
  this adventure, make your way back to the 'Home' tab situated in the top navigation
  bar and click it. Lastly, rest assured that the list of all events remains unchanged
  from its original state.
