name: Create Lecture
setup_function: login_to_indico
steps:
- action: Click 'Create event' in the top navigation bar
  expectation: A dropdown is shown with three options for creating a lecture, a meeting,
    or a conference
  ground_truth: |
    expect(page.get_by_role("link", name="Create lecture").or_(page.get_by_role("link", name="Lecture", exact=True))).to_be_visible()
- action: Click option to create lecture in dropdown
  expectation: A dialog form with title 'Create new lecture' is shown (no need to
    check details)
  ground_truth: |
    expect(page.get_by_text("Create new lecture")).to_be_visible()
- action: Type 'New Lecture' in 'Event title'
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("New Lecture")
- action: Set 'Protection mode' to 'Public'
  expectation: A dialog form with title 'Create new conference' is shown (no need
    to check details)
  ground_truth: |
    expect(page.locator("#form-group-event-creation-protection_mode")).to_contain_text("The event will be publicly accessible since it is set as public.")
- action: Click 'Create event'
  expectation: An event settings page for the created event is shown
  ground_truth: |
    expect(page.locator(".title-with-actions")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the created event
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To initiate the process, one must interact with the ''Create event'' button
  located within the top navigation bar. Next, you will observe a dropdown menu presenting
  you with three distinct choices: crafting a lecture, organizing a meeting, or assembling
  a conference. For our purposes today, let''s proceed by selecting the option to
  establish a lecture from the dropdown menu. Note that upon selection, a dialog box
  titled ''Create new lecture'' appears on your screen; feel free to bypass the detailed
  examination of its contents. Now, enter the phrase ''New Lecture'' into the designated
  ''Event title'' field, ensuring your input is accurately reflected. Transitioning
  to a more technical note, it''s crucial to adjust the ''Protection mode'' setting
  to ''Public'' for optimal visibility. Interestingly, if you were aiming to set up
  a conference instead, a similar dialog form would appear, but we''ll stick to our
  current path. After filling out the necessary information, simply click the ''Create
  event'' button to finalize the setup. Upon successful creation, you will be redirected
  to an event settings page dedicated to the newly formed event. To conclude, navigate
  back to the homepage by clicking ''Home'' in the top navigation bar. In the end,
  the list of all events should now include the newly added event, making it exactly
  one item longer than before.'
