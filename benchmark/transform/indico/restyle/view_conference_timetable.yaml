name: View Conference Timetable
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Conference 1'
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#main-content").get_by_text("Registration", exact=True)).to_be_visible()
- action: Click on 'Timetable'
  expectation: An event timetable is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Timetable")).to_be_visible()
- action: Click on 'Sun 02/03' tab
  expectation: An event timetable is shown
  ground_truth: |
    expect(page.locator('li[role="tab"][aria-controls="x-tab-2"]')).to_have_attribute("aria-selected", "true")
- action: Click on 'Filter' tab
  expectation: Filter options is shown at the bottom
  ground_truth: |
    expect(page.get_by_role("cell", name="Filter options")).to_be_visible()
- action: In filter options, click 'Sessions' dropdown
  expectation: A filter list containing Sessions 1, 2, 3 is shown
  ground_truth: |
    expect(page.get_by_role("listitem").filter(has_text="Session 1")).to_be_visible()
- action: Uncheck 'Session 2' in 'Sessions' filter dropdown
  expectation: A filter list containing Sessions 1, 2, 3 is shown
  ground_truth: |
    expect(page.get_by_role("listitem").filter(has_text="Session 1")).to_be_visible()
- action: Wait
  expectation: Session 2 is no longer visible in the timetable
  ground_truth: expect(page.locator('li:has(span:text("Session 2")) input[type="checkbox"]')).not_to_be_checked()
paragraph: In the 'All Events' section, you'll find an array of gatherings, but for
  our purposes today, let's focus on 'Conference 1'. To proceed, simply click on 'Timetable',
  which will reveal the structured schedule of events awaiting your review. Note that
  when you select the 'Sun 02/03' tab, an event timetable appears, guiding you through
  the day's activities with precision. If you're looking to narrow down the options,
  clicking on the 'Filter' tab is your next step, where you'll discover various filter
  options neatly arranged at the bottom of the screen. Imagine a scenario where you're
  exploring the 'Sessions' dropdown within the filter options; here, a list emerges,
  showcasing Sessions 1, 2, and 3 like chapters in a book. For those who wish to exclude
  Session 2 from their view, unchecking it in the 'Sessions' filter dropdown does
  the trick. As expected, after a brief pause, the timetable refreshes, and Session
  2 vanishes from sight, leaving only Sessions 1 and 3 in clear view.
