name: Create Meeting
setup_function: login_to_indico
steps:
- action: Click 'Create event' in the top navigation bar
  expectation: A dropdown is shown with three options for creating a lecture, a meeting,
    or a conference
  ground_truth: |
    expect(page.get_by_role("link", name="Create meeting").or_(page.get_by_role("link", name="Meeting", exact=True))).to_be_visible()
- action: Click option to create meeting in dropdown
  expectation: A dialog form with title 'Create new meeting' is shown (no need to
    check details)
  ground_truth: |
    expect(page.get_by_text("Create new meeting")).to_be_visible()
- action: Type 'New Meeting' in 'Event title'
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("New Meeting")
- action: Set 'Protection mode' to 'Public'
  expectation: A dialog form with title 'Create new conference' is shown (no need
    to check details)
  ground_truth: |
    expect(page.locator("#form-group-event-creation-protection_mode")).to_contain_text("The event will be publicly accessible since it is set as public.")
- action: Click 'Create event'
  expectation: An event settings page for the created event is shown
  ground_truth: |
    expect(page.locator(".title-with-actions")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the created event
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: 'To initiate the process, one must interact with the ''Create event'' button
  located within the top navigation bar. Next, you will observe a dropdown menu presenting
  you with three distinct choices: crafting a lecture, organizing a meeting, or assembling
  a conference. For our purposes today, let''s proceed by selecting the option to
  establish a meeting from the dropdown list provided. Note that upon selection, a
  dialog box titled ''Create new meeting'' will appear on your screen; however, there''s
  no requirement to delve into its specifics at this juncture. Now, imagine typing
  ''New Meeting'' into the designated ''Event title'' field, whereupon the system
  acknowledges your input by displaying the exact text you''ve just entered. Transitioning
  to a more technical aspect, ensure that the ''Protection mode'' setting is adjusted
  to ''Public'' for optimal accessibility. Suddenly, an unexpected twist occurs as
  a dialog form labeled ''Create new conference'' pops up instead—rest assured, this
  detail requires no further investigation. With everything set, press the ''Create
  event'' button to finalize the setup. Following this action, the screen transitions
  to reveal the event settings page dedicated to the newly minted event. As we conclude
  our journey, a simple tap on the ''Home'' link in the top navigation bar will suffice.
  In the end, the list of all events should mirror the original lineup, enriched by
  the addition of our freshly created event.'
