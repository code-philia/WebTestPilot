name: View Meeting Details
setup_function: login_to_indico
steps:
- action: Scroll down
  expectation: A list of events is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="January")).to_be_visible()
- action: Click 'Meeting 1'
  expectation: The details of the meeting (date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Meeting")).to_be_visible()
- action: Click on the 'Home' icon
  expectation: The event titles (normalized and without newlines) in 'All Events'
    (past, present, and future) are currently exactly the same as they were initially
  ground_truth: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: Scroll down. A list of events is shown. Click 'Meeting 1'. The details
  of the meeting (date, venue) is shown. The event titles (normalized and without
  newlines) in 'All Events' (past, present, and future) are currently exactly the
  same as they were initially.
