name: Favourite Meeting
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'PhD Research Group Monthly Meeting'
  expectation: The details of the meeting (date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading")).to_contain_text("PhD Research Group Monthly Meeting")
- action: Click 'Add event to favourites' (star) icon
  expectation: The details of the conference (date, venue) is shown
  ground_truth: |
    expect(page.locator("#favorite-link > button.i-button")).to_have_attribute("title", "Delete event from favorites")
- action: Click on the 'Home' icon
  expectation: Only the 'Conference 1' is favourited (indicated by a star next to
    the title or a red title text) in event list
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: From 'All Events' click 'PhD Research Group Monthly Meeting'. The details
  of the meeting (date, venue) is shown. The details of the conference (date, venue)
  is shown. Click on the 'Home' icon. Only the 'Conference 1' is favourited (indicated
  by a star next to the title or a red title text) in event list.
