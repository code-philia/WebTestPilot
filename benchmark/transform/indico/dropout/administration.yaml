name: Administration
setup_function: login_to_indico
steps:
- action: Click on 'Administration' in the top navigation bar
  expectation: A message 'A new Indico version...' is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="General Settings")).to_be_visible()
- action: Click on 'User Management' in the sidebar
  expectation: The 'User Management' section is expanded (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Users")).to_be_visible()
- action: Click on 'Users' under 'User Management' in the sidebar
  expectation: A panel with title 'Manage users' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_text("Manage users")).to_be_visible()
- action: Click on 'Customisation' in the sidebar
  expectation: The 'Customisation' section is expanded (no need to check details)
  ground_truth: |
    expect(page.get_by_role("link", name="Document Templates")).to_be_visible()
- action: Click on 'Document Templates' under 'Customisation' in the sidebar
  expectation: A red warning message with 'Danger zone' is shown (no need to check
    details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Document Templates")).to_be_visible()
- action: Click on 'Payment' under 'Customisation' in the sidebar
  expectation: A page with title 'Payment' and 'Save' button is shown (no need to
    check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Payment")).to_be_visible()
- action: Click on 'Unlisted events' under 'Customisation' in the sidebar
  expectation: A page with title 'Unlisted events' and an 'Enabled' toggle button
    with 'Save' button is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Unlisted events")).to_be_visible()
paragraph: Click on 'Administration' in the top navigation bar. A message 'A new Indico
  version...' is shown. Click on 'User Management' in the sidebar. The 'User Management'
  section is expanded (no need to check details). Click on 'Users' under 'User Management'
  in the sidebar. Click on 'Customisation' in the sidebar. The 'Customisation' section
  is expanded (no need to check details). Click on 'Document Templates' under 'Customisation'
  in the sidebar. A red warning message with 'Danger zone' is shown (no need to check
  details). Click on 'Payment' under 'Customisation' in the sidebar. A page with title
  'Payment' and 'Save' button is shown (no need to check details). Click on 'Unlisted
  events' under 'Customisation' in the sidebar. A page with title 'Unlisted events'
  and an 'Enabled' toggle button with 'Save' button is shown (no need to check details).
