name: Search Events
setup_function: login_to_indico
steps:
- action: Type 'test' as query in search bar
  expectation: Search bar contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Search Indico ADMIN Skip")).to_have_value("test")
- action: Press 'Enter'
  expectation: Page with title 'Search' is shown (no need to check details)
  ground_truth: |
    expect(page.get_by_role("heading", name="Search")).to_be_visible()
- action: Wait
  expectation: All entries in the search results contain “test” in the event title
    (case-insensitive).
  ground_truth: expect(page.get_by_role("heading", name="Search")).to_be_visible()
paragraph: Search bar contains typed text. Press 'Enter'. Page with title 'Search'
  is shown (no need to check details). Wait. All entries in the search results contain
  “test” in the event title (case-insensitive).
