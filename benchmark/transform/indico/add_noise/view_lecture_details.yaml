name: View Lecture Details
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 2 w/ Survey'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 2 w/ Survey")).to_be_visible()
- action: Click on the 'Home' icon
  expectation: The event titles (normalized and without newlines) in 'All Events'
    (past, present, and future) are currently exactly the same as they were initially
  ground_truth: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
