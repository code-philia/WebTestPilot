name: Edit Lecture
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 1'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 1")).to_be_visible()
- action: In the top navigation bar, click the pen icon to switch to the event's management
    area
  expectation: A sidebar with 'Advanced Options' tab is shown
  ground_truth: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
- action: Click on the edit icon at the end of title
  expectation: Event title and description become editable fields
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_be_visible()
- action: Type 'Updated Lecture 1' in 'Event title' field
  expectation: Event title field contains typed text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("Updated Lecture 1")
- action: Scroll down
  expectation: Save button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
- action: Click 'Save' button
  expectation: The 'Title' field contains 'Updated Lecture 1'
  ground_truth: |
    expect(page.locator("#event-settings-data")).to_contain_text("Updated Lecture 1")
- action: Scroll up
  expectation: Home button is visible in top navigation bar
  ground_truth: |
    expect(page.locator("#global-menu").get_by_role("link", name="Home")).to_be_visible()
- action: Click 'Home' in top navigation bar
  expectation: All events are preserved and unchanged except for the title change
    of one event from 'Lecture 1' to 'Updated Lecture 1'
  ground_truth: expect(page.get_by_role("heading", name="All events")).to_be_visible()
paragraph: From 'All Evnts', clk 'Lect 1'. Dtls shwn (lectr, dt, vnu). Top nav bar,
  clk pen icn -> mgmt area. Sidebar w/ 'Adv Optns' tab. Clk edit icn @ end of title.
  Title & desc -> edbl flds. Typ 'Updtd Lect 1' in 'Evt title'. Fld cntns txt. Scrl
  dwn. Save btn vis. Clk 'Save'. 'Title' fld = 'Updtd Lect 1'. Scrl up. Home btn vis
  in top nav bar. Clk 'Home'. All evnts prsvd & unchngd xcept title chng fr 1 evt
  frm 'Lect 1' to 'Updtd Lect 1'
