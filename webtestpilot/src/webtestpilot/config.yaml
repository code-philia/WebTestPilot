# config.yaml
# See `baml_src/clients` for available clients

parser:
  # Semantic parsing of text descriptions into (condition, action, expectation) test steps
  llm_client: "OpenRouter"

  # Automatically infer <unknown> placeholders in parsed test steps
  # If false, throw exception and inform user
  infer_missing_steps: false

executor:
  # Action execution mode: "som" (default), "browser-use", or "playwright-code-gen"
  # "som"          - two-stage pipeline: GUI grounding model → Set-of-Mark annotation → action proposer
  # "browser-use"  - one-shot LLM agent via browser-use (no GUI grounding model required)
  # "playwright-code-gen" - one-shot LLM/VLM code generator that executes sync Playwright code
  # "dom-rag" - retrieves and reranks actionable DOM elements before asking the LLM to select the final target, reducing coordinate-grounding instability.
  mode: "dom_rag"

  # playwright-code-gen settings (only used when mode is "playwright-code-gen")
  playwright_codegen:
    # LLM client for generating Playwright code (see baml_src/clients.baml for available clients)
    llm_client: "OpenRouter"

    # Number of repair generations after executing generated code fails.
    # With the default value, attempts 0-2 use Playwright AI snapshots and
    # attempt 3 falls back to the legacy DOM summary.
    max_revisions: 3

    # Number of Playwright AI snapshot attempts before falling back to DOM summary.
    snapshot_fallback_after_attempts: 3

    # Timeout budget for post-action browser load waits.
    timeout_ms: 5000

  # browser-use settings (only used when mode is "browser-use")
  browser_use:
    # LLM client for the browser-use agent (see baml_src/clients.baml for available clients)
    llm_client: "OpenRouter"

    # Maximum number of steps the browser-use agent may take per action.
    # Note: minimum 2 steps, agent needs to call done(), which counts as 1 step.
    max_steps: 3

    # CDP endpoint of the browser to connect to.
    # browser-use connects via Chrome DevTools Protocol to reuse the existing browser session
    # (cookies, auth state, current page).
    #
    # How to expose the CDP endpoint from your Playwright browser:
    #   browser = playwright.chromium.launch(args=["--remote-debugging-port=9222"])
    #
    # Then set this to: "http://localhost:9222"
    cdp_url: "http://localhost:9222"

  # SoM (Set-of-Mark) settings (only used when mode is "som")
  som:
    # Locates UI elements (x, y) from a UI description
    ui_locator: "GUI_Grounding_Model"

  llm_clients:
    # Generates pre- and post-conditions using the assertion API
    assertion_generation: "OpenRouter"

    # Executes assertion API methods (e.g., extract() from state and element)
    assertion_api: "OpenRouter"

    # Proposes actions given a natural language action description
    action_proposer: "OpenRouter"

    # For tracking same logical pages across states
    page_reidentification: "OpenRouter"

  # How many times in total to try post-condition generation.
  max_tries: 1

  # DOM-RAG settings.
  # Pipeline: DOM candidate collection -> DMR dual encoder retrieval -> MindAct cross encoder reranking -> structured LLM decision.
  dom_rag:
    dom_rag_top_k: 100
    dom_rag_max_candidates: 500

    dom_rag_dual_top_k: 80
    dom_rag_cross_top_k: 500

    enable_dual_encoder: false
    enable_cross_encoder: true

    dom_rag_dual_encoder_model: "McGill-NLP/MiniLM-L6-dmr"
    dom_rag_cross_encoder_model: "osunlp/MindAct_CandidateGeneration_deberta-v3-base"

    # Use null for CPU. Use "cuda" on GPU. Use "mps" on Apple Silicon only if stable.
    dom_rag_ranker_device: mps
